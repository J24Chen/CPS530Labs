</head>
<body>
    <h1>Problem 1</h1>
    <svg viewbox="-30 -50 600 350">
            <path d=
                    "M 10, 80
                     L 80, 80
                     Q 60, 60 60, 40
                     A 30, 25 10 1 0 50, 20
                     A 30, 35 0 1 0 35, 20 
                     A 30, 25 10 1 0 30, 40
                     Q 30, 60 10, 80
                " 
                fill="#027f00"/>

            <polygon points="240,80 280,25 240,-30 200,25" 
            fill="#0000fe"/>

            <path d="M 10,180
                   C 10,150 50,145 60,175
                   C 60,175 90,135 110,175
                   C 110,175 114,195 110,200
                   L 60,265
                   L 15,200
                   C 15,195 8,195 10,180"
                fill="#ff0000"/>

            <path d="
                M 240,165
                C 230,180 200,195 200,215
                C 200,235 225,240 235,225
                Q 235,250 225,265
                L 255,265
                Q 245,250 245,225
                C 255,240 280,235 280,215
                C 280,195 250,180 240,165" 
                fill="black"/>
            />
    </svg>
    <h1>Problem 2</h1>
    <svg>
        <text x="15" y="25" style="fill:rgb(20, 20, 131); font-size:2rem;">
            JASON
        </text>
        <path d="M 0, 50
                 Q 60,10 130,50"
            stroke = "red"
            stroke-width="3"
            fill = "none"/>
        <text x="25" y="70" style="fill:rgb(7, 132, 20); font-size:2rem;">
            Chen
    </svg>

    <h1>Problem 3</h1>
    <canvas id="canvas1" width="600" height="300"> </canvas>

    <script> 
        c1 = document.getElementById("canvas1");
        ctx1 = c1.getContext("2d");
        ctx1.fillStyle = "rgb(216, 234, 218)";
        ctx1.fillRect(0,0,600,300);

        ctx1.fillStyle = "rgb(44, 129, 209)";
        ctx1.fillRect(30,30,220,120);
        
        ctx1.fillStyle = "rgb(137, 237, 83)";
        ctx1.arc(260, 70, 40, 0, Math.PI * 2);
        ctx1.fill();
        ctx1.strokeStyle = 'ForestGreen';
        ctx1.lineWidth = 4;
        ctx1.stroke();

        ctx1.strokeStyle = "Orangered";
        ctx1.lineWidth = 1;
        ctx1.font = "24px Arial";
        ctx1.strokeText("Canvas by Jason Chen", 10,60);

         ctx1.fillStyle="DarkViolet"
        ctx1.translate(500, 200);
        ctx1.rotate((45 * Math.PI) / 180);
        ctx1.fillRect(-40, -40, 80, 80);


        let r = 0;
        
        function animate() {
            //Clear previous frame
            ctx1.clearRect(-40, -40, 80, 80);

            //Update rotation angle
            r+=0.0005;
            if (r >= 360) {
                r = 0;
            }
            ctx1.rotate((r * Math.PI) / 180);
            ctx1.fillRect(-40, -40, 80, 80)
            requestAnimationFrame(animate);
        }

        animate();



    </script>
</body>
</html>
